name: Build and functional tests

# Builds every device in ledger_app.toml, then runs the Ragger tests on the emulator, including
# the security audit's attack transactions.

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
  pull_request:

# Read-only token; each job grants only the scopes its Ledger workflow declares.
permissions:
  contents: read

jobs:
  build_application:
    name: Build the app
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@db5fd3d8e4fe724ccc4617709c9e245976ee8280  # v1.113.0
    # The scopes each workflow declares at v1.113.0; GitHub will not start one with fewer.
    permissions:
      contents: read
      actions: write        # upload the built app
      pull-requests: write  # comment on pull requests
    with:
      upload_app_binaries_artifact: compiled_app_binaries

  ragger_tests:
    name: Functional tests
    needs: build_application
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@db5fd3d8e4fe724ccc4617709c9e245976ee8280  # v1.113.0
    permissions:
      contents: write       # open a pull request with new snapshots when asked to
      actions: write        # upload and delete test artifacts
      pull-requests: write  # open a pull request with new snapshots when asked to
    with:
      download_app_binaries_artifact: compiled_app_binaries
      # Speculos has no Nano S; host_tests.yml covers it.
      run_for_devices: '["nanox", "nanosp"]'
