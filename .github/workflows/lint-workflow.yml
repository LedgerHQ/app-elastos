name: Code style check

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop

# The job only reads the repository.
permissions:
  contents: read

jobs:
  job_lint:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Clone
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false  # no later step needs the token

      # Pinned from PyPI; the old lint action built on a moving, unsupported Python 3.9 image.
      - name: Install clang-format 11.1.0
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install --only-binary=:all: clang-format==11.1.0.2

      - name: Lint
        run: |
          "$RUNNER_TEMP/clang-format/bin/clang-format" --style=file --dry-run --Werror src/*.c src/*.h
